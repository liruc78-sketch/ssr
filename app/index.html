<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Crypto.ssr — Exchange</title>

    <!-- Set theme before paint to avoid a flash -->
    <script>
        (function () {
            var t = 'light';
            try { t = localStorage.getItem('theme') || 'light'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', t);
            var m = document.createElement('meta');
            m.name = 'theme-color';
            m.content = t === 'dark' ? '#0b0e14' : '#f5f7fb';
            document.head.appendChild(m);
        })();
    </script>

    <meta name="description" content="Crypto.ssr — trade spot, perpetuals and options, earn with finance products, and manage your assets in one place.">
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../crypto-ssr-icon.svg">
    <link rel="apple-touch-icon" href="../icon-180.png">

    <!-- Type: Space Grotesk (display) · IBM Plex Sans (UI) · JetBrains Mono (numerics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/views.css">

      }

</head>
