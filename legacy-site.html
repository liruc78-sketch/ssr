<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto.ssr</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://www.cryptossr.com/">
    <!-- The old single-file site was retired. This URL only clears its stale
         wallet session key and sends old bookmarks to the app at /. -->
    <script>
        try { localStorage.removeItem('tw_user_session'); } catch (e) {}
        location.replace('/');
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
    <style>
        :root { color-scheme: light dark; --bg: #f5f7fa; --fg: #1a1f2b; --link: #1f6feb; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0D1016; --fg: #e6e9ef; --link: #6aa6ff; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 0 16px;
               background: var(--bg); color: var(--fg);
               font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
        a { color: var(--link); }
    </style>
</head>
<body>
    <p>Crypto.ssr has moved. <a href="/">Continue to the app</a>.</p>
</body>
</html>
